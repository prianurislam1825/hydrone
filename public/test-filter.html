<!DOCTYPE html>
<html>
<head>
  <style>
    body { background-color: #0D1B3E; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .logo {
      width: 200px; height: 200px;
      background-image: url('pfp-hydrone.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      
      /* The magic filters */
      filter: invert(1) grayscale(1) brightness(10) contrast(10);
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div class="logo"></div>
</body>
</html>
